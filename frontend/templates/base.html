<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}SOC Platform{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            soc: {
              bg: '#0f1117',
              surface: '#181a21',
              border: '#2d3139',
              text: '#e4e6eb',
              muted: '#9ca3af',
              critical: '#ef4444',
              high: '#f97316',
              medium: '#eab308',
              low: '#3b82f6',
              safe: '#22c55e',
            }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script defer src="https://unpkg.com/alpinejs@3.13.3/dist/cdn.min.js"></script>
  <style>
    body { background-color: #0f1117; color: #e4e6eb; }
    .nav-item.active { background: #2d3139; border-left: 3px solid #3b82f6; }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="min-h-screen bg-soc-bg text-soc-text antialiased">
  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-56 shrink-0 border-r border-soc-border bg-[#181a21] flex flex-col">
      <div class="p-4 border-b border-soc-border">
        <span class="font-semibold text-soc-text">SOC Platform</span>
      </div>
      <nav class="p-2 flex-1">
        <a href="/" class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg text-soc-muted hover:bg-soc-border hover:text-soc-text {% if request.url.path == '/' %}active text-soc-text{% endif %}">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6z" /></svg>
          Dashboard
        </a>
        <a href="/alerts" class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg text-soc-muted hover:bg-soc-border hover:text-soc-text {% if request.url.path.startswith('/alerts') and request.url.path == '/alerts' %}active text-soc-text{% endif %}">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>
          Alerts
        </a>
        <a href="/incidents" class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg text-soc-muted hover:bg-soc-border hover:text-soc-text {% if request.url.path.startswith('/incidents') %}active text-soc-text{% endif %}">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
          Incidents
        </a>
        <a href="/mitre" class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg text-soc-muted hover:bg-soc-border hover:text-soc-text {% if request.url.path.startswith('/mitre') %}active text-soc-text{% endif %}">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
          MITRE Coverage
        </a>
        <a href="/sources" class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg text-soc-muted hover:bg-soc-border hover:text-soc-text {% if request.url.path.startswith('/sources') %}active text-soc-text{% endif %}">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-14 0" /></svg>
          Sources
        </a>
        <a href="#" class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg text-soc-muted hover:bg-soc-border hover:text-soc-text">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
          Settings
        </a>
      </nav>
    </aside>

    <div class="flex-1 flex flex-col min-w-0">
      <!-- Top bar -->
      <header class="h-14 border-b border-soc-border bg-[#181a21] flex items-center justify-between px-6 shrink-0">
        <span class="font-medium text-soc-text">SOC Platform</span>
        <div class="flex items-center gap-4">
          <span class="text-sm text-soc-muted">Open Critical:</span>
          <span class="rounded px-2 py-0.5 text-sm font-medium text-white" style="background-color:#ef4444">{{ open_critical | default(0) }}</span>
          <span class="text-sm text-soc-muted">Open High:</span>
          <span class="rounded px-2 py-0.5 text-sm font-medium text-white" style="background-color:#f97316">{{ open_high | default(0) }}</span>
        </div>
      </header>

      <main class="flex-1 overflow-auto p-6">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
