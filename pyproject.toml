[project]
name = "soc-platform"
version = "1.0.0"
description = "AI-assisted SOC log aggregation and incident triage platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.135.3",
    "uvicorn[standard]==0.43.0",
    "sqlalchemy[asyncio]==2.0.49",
    "aiosqlite==0.22.1",
    "alembic==1.18.4",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "python-dotenv==1.2.2",
    "httpx==0.28.1",
    "Authlib>=1.3.0",
    "itsdangerous>=2.2.0",
    "aiofiles==25.1.0",
    "PyJWT[crypto]>=2.8.0",
    "python-multipart==0.0.24",
    "schedule==1.2.2",
    "rich==14.3.3",
    "click==8.3.2",
    "pyyaml==6.0.3",
    "jinja2==3.1.6",
    "openai==2.30.0",
    "anthropic==0.89.0",
    "aiosmtplib>=3.0.0",
    "boto3>=1.34.0",
    "bleach==6.3.0",
    "argon2-cffi==25.1.0",
    # Structured logging
    "structlog==25.5.0",
    "python-json-logger==3.3.0",
    # Observability / metrics
    "prometheus-client==0.24.1",
    "prometheus-fastapi-instrumentator==7.1.0",
    # OpenTelemetry tracing
    "opentelemetry-api==1.40.0",
    "opentelemetry-sdk==1.40.0",
    "opentelemetry-instrumentation-fastapi==0.61b0",
    "opentelemetry-instrumentation-sqlalchemy==0.61b0",
    "opentelemetry-instrumentation-httpx==0.61b0",
    "opentelemetry-exporter-jaeger-thrift==1.21.0",
]

[dependency-groups]
dev = [
    "pip-audit==2.10.0",
    "safety==3.7.0",
    "bandit==1.9.4",
    "pip-tools==7.5.3",
    "pre-commit==4.5.1",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "black==26.3.1",
    "ruff==0.15.9",
    "mypy==1.20.0",
    "types-bleach>=6.1.0",
    "types-PyYAML>=6.0.0",

]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
omit = [
    "app/connectors/*",
    "app/ai/*",
]

[tool.mypy]
python_version = "3.11"
# Optional integrations (boto3, google.*, ldap3, …) are not always installed in dev/CI.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "prometheus_fastapi_instrumentator",
    "prometheus_fastapi_instrumentator.*",
    "opentelemetry.*",
    "structlog.*",
]
ignore_missing_imports = true

# Bandit (CI Security Scan): B501 flags httpx verify=False used for customer appliances with private CAs.
[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv", "frontend"]
skips = ["B501"]
