[project]
name = "soc-platform"
version = "0.1.0"
description = "AI-assisted SOC log aggregation and incident triage platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn[standard]==0.41.0",
    "sqlalchemy[asyncio]==2.0.48",
    "aiosqlite==0.22.1",
    "alembic==1.18.4",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "python-dotenv==1.2.2",
    "httpx==0.28.1",
    "aiofiles==25.1.0",
    "python-jose[cryptography]==3.5.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.22",
    "schedule==1.2.2",
    "rich==14.3.3",
    "click==8.3.1",
    "pyyaml==6.0.3",
    "openai==2.26.0",
    "anthropic==0.84.0",
    "bleach==6.3.0",
    "argon2-cffi==25.1.0",
]

[dependency-groups]
dev = [
    "pip-audit==2.10.0",
    "safety==3.7.0",
    "bandit==1.9.4",
    "pip-tools==7.5.3",
    "pre-commit==4.5.1",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "httpx==0.28.1",
    "black==26.3.0",
    "ruff==0.15.5",
    "mypy==1.19.1",
    "types-bleach>=6.1.0",
    "types-python-jose>=3.3.0",
    "types-passlib>=1.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "prometheus_fastapi_instrumentator",
    "prometheus_fastapi_instrumentator.*",
]
ignore_missing_imports = true
