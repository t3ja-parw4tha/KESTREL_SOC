version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
      minor-updates:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "python"
      - "security"
    reviewers:
      - "t3ja-parw4tha"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
    labels:
      - "dependencies"
      - "javascript"
      - "security"
    reviewers:
      - "t3ja-parw4tha"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
      - "security"
    reviewers:
      - "t3ja-parw4tha"

  - package-ecosystem: "docker"
    directory: "/docker"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"
      - "security"
    reviewers:
      - "t3ja-parw4tha"
