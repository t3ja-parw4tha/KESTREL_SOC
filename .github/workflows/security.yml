name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run Bandit SAST
        run: bandit -r app/ -ll -f json -o bandit-report.json || true
      - name: Run pip-audit (dependency CVEs)
        run: pip-audit --format json -o audit-report.json || true
      - name: Run safety check
        run: safety check --json > safety-report.json 2>/dev/null || echo "[]" > safety-report.json
      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: "*-report.json"
