# Dependabot and fork PRs do not receive repository secrets; Safety (PyUp) needs SAFETY_API_KEY.
# Skip the real Safety run for those triggers and rely on pip-audit in this job for CVE signal.
name: Security Scan

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  security-events: write

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install production dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Run pip-audit (production requirements only)
        # Auditing the active venv includes dev/test tools (selenium, pip-audit, etc.) and causes
        # false-positive CVE failures unrelated to the shipped app.
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --format json -o audit-report.json \
            && echo "pip-audit: no CVEs" \
            || { echo "pip-audit CVEs found — review audit-report.json"; exit 1; }
      - name: Install dev dependencies and Semgrep
        run: |
          pip install -r requirements-dev.txt
          pip install semgrep
      - name: Run Bandit SAST
        # -ll: medium+ severity. Skips in pyproject.toml document intentional connector TLS behavior (B501).
        run: |
          bandit -c pyproject.toml -r app/ -ll -f json -o bandit-report.json \
            && echo "Bandit: no medium+ findings" \
            || { echo "Bandit findings detected — review bandit-report.json"; exit 1; }
      - name: Run safety check
        if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
        run: |
          if [ -z "${SAFETY_API_KEY:-}" ]; then
            echo '{"skipped": true, "reason": "SAFETY_API_KEY not set; add repo secret to enforce PyUp Safety. pip-audit still ran."}' > safety-report.json
            exit 0
          fi
          python -m venv .venv-safety
          .venv-safety/bin/pip install --upgrade pip
          .venv-safety/bin/pip install "safety==2.3.5"
          set -o pipefail
          .venv-safety/bin/safety check -r requirements.txt --output json | tee safety-report.json

      - name: Safety report placeholder (Dependabot / fork PRs)
        if: ${{ github.actor == 'dependabot[bot]' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
        run: |
          echo '{"skipped": true, "reason": "Dependabot or fork PR — SAFETY_API_KEY unavailable; pip-audit still ran."}' > safety-report.json
      - name: Run Semgrep SAST
        # --error: exit 1 on any finding. Covers OWASP top 10 + security-audit ruleset.
        run: |
          semgrep scan \
            --config auto \
            --config p/python \
            --config p/security-audit \
            --error \
            --json \
            --output semgrep-report.json \
            app/ \
            && echo "Semgrep: no findings" \
            || { echo "Semgrep findings detected — review semgrep-report.json"; exit 1; }
      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            audit-report.json
            safety-report.json
            semgrep-report.json
          if-no-files-found: warn
