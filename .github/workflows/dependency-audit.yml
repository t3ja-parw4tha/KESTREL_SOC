name: Dependency Security Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'

jobs:
  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install audit tools
        run: pip install pip-audit safety bandit pip-tools

      - name: Install Semgrep (Linux)
        run: pip install semgrep

      - name: pip-audit (CVE check)
        run: |
          pip-audit -r requirements/base.txt --format json --output pip-audit-report.json || true
          pip-audit -r requirements/base.txt

      - name: Safety check
        run: |
          safety check -r requirements/base.txt --output json > safety-report.json 2>/dev/null || echo '{"vulnerabilities":[]}' > safety-report.json
          safety check -r requirements/base.txt
        env:
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}

      - name: Bandit SAST scan
        run: |
          bandit -r app/ -ll -f json -o bandit-report.json --exit-zero || true
          bandit -r app/ -ll

      - name: Semgrep SAST scan
        run: |
          semgrep scan --config auto --config p/python --config p/security-audit --config p/owasp-top-ten --json --output semgrep-report.json app/ || true
          semgrep scan --config auto --config p/python --config p/security-audit app/

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-security-reports
          path: |
            pip-audit-report.json
            safety-report.json
            bandit-report.json
            semgrep-report.json
          retention-days: 90

  frontend-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: npm audit
        run: |
          cd frontend
          npm audit --audit-level=high --json > npm-audit-report.json 2>/dev/null || echo '{}' > npm-audit-report.json
          npm audit --audit-level=high

      - name: ESLint security scan
        run: |
          cd frontend
          npx eslint src/ --max-warnings 0 -o eslint-security-report.json 2>/dev/null || true
        continue-on-error: true

      - name: Upload frontend reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-security-reports
          path: |
            frontend/npm-audit-report.json
            frontend/eslint-security-report.json
          retention-days: 90

  docker-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t soc-platform:test .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'soc-platform:test'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

  secret-scanning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified
