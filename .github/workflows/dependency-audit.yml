# Dependabot PRs use a read-only GITHUB_TOKEN and do not receive repository secrets.
# Skip Safety (needs SAFETY_API_KEY) and SARIF upload (needs security-events: write) for those runs.
# pip-audit / npm audit / Trivy / Bandit / Semgrep still run; CVE signal remains.
name: Dependency Security Audit

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install audit tools
        run: pip install pip-audit bandit pip-tools

      - name: Install Semgrep (Linux)
        run: pip install semgrep

      - name: pip-audit (CVE check)
        run: |
          pip-audit -r requirements/base.txt --format json --output pip-audit-report.json

      - name: Safety check
        if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          # Safety 2.3.5 pins packaging<22; installing it in the main env breaks pip-audit/build.
          python -m venv .venv-safety
          .venv-safety/bin/pip install --upgrade pip
          .venv-safety/bin/pip install "safety==2.3.5"
          .venv-safety/bin/safety check -r requirements/base.txt --output json > safety-report.json
        env:
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}

      - name: Safety report placeholder (Dependabot / fork PRs)
        if: ${{ github.actor == 'dependabot[bot]' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
        run: |
          echo '{"skipped": true, "reason": "Secrets not available on Dependabot or fork PRs; pip-audit still ran."}' > safety-report.json

      - name: Bandit SAST scan
        run: |
          bandit -c pyproject.toml -r app/ -ll -f json -o bandit-report.json

      - name: Semgrep SAST scan
        run: |
          semgrep scan --config auto --config p/python --config p/security-audit --config p/owasp-top-ten --error --json --output semgrep-report.json app/

      - name: Upload security reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-security-reports
          path: |
            pip-audit-report.json
            safety-report.json
            bandit-report.json
            semgrep-report.json
          retention-days: 90

  frontend-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: npm audit
        run: |
          cd frontend
          npm audit --audit-level=high --json > npm-audit-report.json
          npm audit --audit-level=high

      - name: ESLint security scan
        # Exit 1 only on errors (e.g. eval, unsanitized DOM). Security rules are mostly "warn"
        # (detect-object-injection is noisy for React patterns); report is still uploaded as artifact.
        run: |
          cd frontend
          npx eslint src/ --format json --output-file eslint-security-report.json

      - name: Upload frontend reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-security-reports
          path: |
            frontend/npm-audit-report.json
            frontend/eslint-security-report.json
          retention-days: 90

  docker-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t soc-platform:test .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: 'soc-platform:test'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Upload Trivy results to GitHub Security
        if: ${{ always() && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

  secret-scanning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@v3.95.5
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified
